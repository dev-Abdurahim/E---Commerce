databaseChangeLog:
  - changeSet:
      id: 002-create-user-roles-table
      author: Abdurahim
      changes:
        - createTable:
            # @ElementCollection User entity ichida shu jadvalni "kutadi".
            # Bu jadvalda BaseEntity maydonlari (id, createdAt...) YO'Q —
            # chunki bu alohida entity emas, faqat User'ning bir qismi (value type)
            tableName: user_roles
            columns:
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_user_roles_user
                    references: users(id)
              - column:
                  name: role
                  type: VARCHAR(20)
                  constraints:
                    nullable: false