databaseChangeLog:
  - changeSet:
      id: 005-create-carts-table
      author: Abdurahim
      changes:
        - createTable:
            tableName: carts
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    unique: true
                    # unique: true -> entity'dagi @OneToOne bilan mos keladi,
                    # har bir user faqat bitta cart'ga ega bo'lishi mumkin
                    foreignKeyName: fk_carts_user
                    references: users(id)
              - column:
                  name: created_at
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: deleted
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false